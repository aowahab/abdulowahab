name: Portfolio baseline CI
on:
  push:
    branches: ['foundation/**', 'feature/phase-2-*', 'fix/mobile-feed-photo-*', 'feature/facebook-style-feed-*', 'fix/desktop-balanced-layout-*', 'feature/footer-live-traffic-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No committed lockfile yet; do not use npm ci until one is added.
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
